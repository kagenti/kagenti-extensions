- Title: AI-based Access Control (AIAC) Agent
- Description: >
    LangGraph-based agent that configures Keycloak access rules from a policy written in
    human language. Triggered via HTTP by Keycloak state change events or a full rebuild
    request. Retrieves the standing policy from the RAG knowledge base, reads current
    Keycloak state via aiac.library.api, interprets the policy against the changed
    state, computes the required RBAC diff, validates it, and applies role assignments and
    revocations immediately.
- Graph:
    - Type: Structured conditional workflow (LangGraph StateGraph) — not ReAct.
        LLM is confined to propose_diff and validate_diff nodes only.
    - Single compiled graph: one graph.compile() instance (module-level singleton exported from graph.py)
        shared by all six FastAPI endpoints. Trigger type and entity ID are passed as initial state;
        nodes branch internally on trigger type.
    - State schema (AgentState TypedDict):
        - trigger: TriggerContext — endpoint type (rebuild | user | realm-role | client | client-role | client-scope) + entity ID
        - realm: str — Keycloak realm, from KEYCLOAK_REALM env var
        - policy_chunks: list[str] — policy text chunks retrieved from aiac-policies ChromaDB collection
        - domain_knowledge_chunks: list[str] — org/business context chunks retrieved from
            aiac-domain-knowledge ChromaDB collection. Empty list when the collection has no
            content — non-fatal, agent continues with empty domain context.
        - keycloak_snapshot: KeycloakSnapshot — scoped Keycloak data fetched for this trigger
        - proposed_diff: ProposedDiff | None — LLM output from propose_diff node
        - validation_errors: list[str] — errors from validate_diff node
        - applied: list[RoleAssignment] — role assignments executed
        - revoked: list[RoleAssignment] — role revocations executed
        - summary: str — human-readable explanation (from LLM reasoning field)
    - Nodes:
        - fetch_policy: queries ChromaDB aiac-policies collection using a trigger-scoped
            similarity search query derived from trigger type (not entity ID).
            Query strings by trigger type:
              rebuild          → "all access control rules"
              user             → "user role assignment rules"
              realm-role       → "realm role assignment rules"
              client           → "client access control rules"
              client-role      → "client role assignment rules"
              client-scope     → "client scope access control rules"
            Number of results capped by CHROMA_N_RESULTS (default 10).
            Stores results in AgentState.policy_chunks.
        - fetch_domain_knowledge: queries ChromaDB aiac-domain-knowledge collection using the
            same trigger-type-keyed query strings as fetch_policy (trigger TYPE only, not entity ID).
            Number of results capped by CHROMA_N_RESULTS (same env var as fetch_policy).
            Returns [] when the collection is empty — non-fatal.
            Stores results in AgentState.domain_knowledge_chunks.
            Shares UPSTREAM_MAX_RETRIES tenacity policy and 503-on-ChromaDB-down contract
            with fetch_policy.
        - fetch_keycloak_state: reads Keycloak state via aiac.library.api;
            scope is determined by trigger type:
              rebuild          → all users, all clients + their roles, all realm roles,
                                 all role mappings for all users
              user/{id}        → that user's current role mappings,
                                 all clients + their roles
              realm-role/{id}  → all users, all realm roles
              client/{id}      → all users, that client's roles,
                                 all role mappings for all users
              client/{id}/role → all users, that client's roles,
                                 all role mappings for all users
              client-scope/{id}→ all client scopes, all clients, all users
        - propose_diff: LLM node — builds scoped text summary (policy chunks +
            Keycloak snapshot + trigger context) and calls LLM via with_structured_output(ProposedDiff)
        - validate_diff: validates proposed diff with four checks (see Validation below)
        - apply_diff: calls assign_client_roles / revoke_client_roles from aiac.library.api
        - format_response: builds final response dict
    - Edges:
        - START → fetch_policy (parallel branch)
        - START → fetch_domain_knowledge (parallel branch)
        - START → fetch_keycloak_state (parallel branch)
        - fetch_policy → propose_diff
        - fetch_domain_knowledge → propose_diff
        - fetch_keycloak_state → propose_diff
        - propose_diff → validate_diff
        - validate_diff → apply_diff (validation passed)
        - validate_diff → format_response (validation failed — binary abort, no changes applied)
        - apply_diff → format_response
        - format_response → END
- Validation node:
    - Existence check: every user_id, client_id, role_id in proposed diff exists in keycloak_snapshot
    - Safety guard rails: abort if total changes (assign + revoke) exceed MAX_CHANGES_PER_RUN
    - LLM re-confirmation: second LLM call (same ChatOpenAI instance, auditor system prompt)
        with proposed diff + policy chunks; output via with_structured_output(ValidationVerdict)
        where ValidationVerdict has approved (bool) and reason (str)
    - Scope validation: diff is bounded to entities referenced by the trigger (no over-reach on partial updates)
    - Failure outcome: binary abort — zero changes applied; returns structured error response
- LLM:
    - SDK: langchain-openai (ChatOpenAI)
    - Endpoint configured via LLM_BASE_URL — any OpenAI-compatible endpoint (vLLM, Ollama, Azure, etc.)
    - Target model must support tool calling (required for with_structured_output)
    - Output: structured via with_structured_output(ProposedDiff)
    - ProposedDiff schema:
        - assign: list[RoleAssignment]
        - revoke: list[RoleAssignment]
        - reasoning: str (propagated as summary in the HTTP response)
    - RoleAssignment schema:
        - user_id: str
        - client_id: str
        - role_id: str
        - role_name: str
    - Prompt structure (prompts.py):
        - System message (stable, cacheable): role definition + AIAC_AC_MODEL framing +
          output instructions ("enforce {AC_MODEL} policy, compute minimal role diff")
        - User message (per-request): trigger description
          + policy chunks (from aiac-policies via fetch_policy)
          + domain knowledge chunks (from aiac-domain-knowledge via fetch_domain_knowledge;
            omitted or rendered as empty section when domain_knowledge_chunks is [])
          + scoped Keycloak snapshot summary (structured text, not raw JSON)
    - Auditor prompt (validate_diff re-confirmation):
        - System message: auditor role ("verify this diff correctly implements the policy")
        - User message: proposed diff + policy chunks + domain knowledge chunks
          (auditor receives the same context as the planner to enable full re-confirmation)
- Configuration:
    - AC_SERVICE_URL: Base URL of the Keycloak Configuration Service.
      Default: http://aiac-keycloak-service:7070
      Source: Environment variable injected via Kubernetes Deployment manifest (ConfigMap).
    - CHROMA_URL: Base URL of the ChromaDB instance in the RAG Pod.
      Default: http://aiac-rag-service:7080
      Source: Environment variable injected via Kubernetes Deployment manifest (ConfigMap).
    - KEYCLOAK_REALM: Keycloak realm targeted by all agent operations.
      Source: Environment variable injected via Kubernetes Deployment manifest (aiac-keycloak-config ConfigMap).
    - LLM_BASE_URL: Base URL of the externally deployed LLM API endpoint.
      Source: Environment variable injected via Kubernetes Deployment manifest (ConfigMap).
    - LLM_MODEL: Model name to use for policy interpretation and diff validation.
      Source: Environment variable injected via Kubernetes Deployment manifest (ConfigMap).
    - LLM_API_KEY: LLM API access token.
      Source: Kubernetes Secret mounted as environment variable.
    - AIAC_AC_MODEL: Access control model type used to frame the LLM system prompt.
      Affects system prompt framing only — not data fetching or output schema.
      Default: RBAC
      Accepted values: RBAC, ABAC, REBAC (uppercase)
      Source: Environment variable injected via Kubernetes Deployment manifest (ConfigMap).
    - CHROMA_N_RESULTS: Maximum number of policy chunks retrieved per ChromaDB query.
      Default: 10
      Source: Environment variable injected via Kubernetes Deployment manifest (ConfigMap).
    - MAX_CHANGES_PER_RUN: Maximum total role changes (assign + revoke) allowed per invocation.
      Default: 50
      Source: Environment variable injected via Kubernetes Deployment manifest (ConfigMap).
    - UPSTREAM_MAX_RETRIES: Number of retry attempts (with exponential backoff) before
      failing on upstream errors (ChromaDB, Keycloak Configuration Service, LLM API).
      Default: 3
      Source: Environment variable injected via Kubernetes Deployment manifest (ConfigMap).
- Invocation: HTTP endpoint
- Endpoints:
    - POST /apply/rebuild: full rebuild — recompute all mappings from current Keycloak
        state and Policy RAG, apply immediately
    - POST /apply/user/{user_id}: recompute and apply mappings affected by a user addition or removal
    - POST /apply/realm-role/{role_id}: recompute and apply mappings affected by a realm role addition or removal
    - POST /apply/client/{client_id}: recompute and apply mappings affected by a client addition or removal
    - POST /apply/client/{client_id}/role/{role_id}: recompute and apply mappings affected by a client role addition or removal
    - POST /apply/client-scope/{scope_id}: recompute and apply mappings affected by a client scope addition or removal
    - Success response: {"applied": [...], "revoked": [...], "summary": "..."}
        where applied/revoked are arrays of RoleAssignment objects and summary is the LLM reasoning
    - Abort response: {"applied": [], "revoked": [], "summary": "...", "validation_errors": [...]}
- State: stateless — changes applied immediately, no pending session required
- Framework: FastAPI with uvicorn
- Port: 7071
- Error handling:
    - All upstream calls are retried up to UPSTREAM_MAX_RETRIES times with exponential backoff
      using the tenacity library before the error is propagated.
    - ChromaDB unavailable → HTTP 503 Service Unavailable
    - Keycloak Configuration Service error → HTTP 502 Bad Gateway
    - LLM API failure → HTTP 504 Gateway Timeout
- Dependencies: langgraph, langchain-openai, chromadb, tenacity, fastapi, uvicorn[standard], requests, python-dotenv
- File structure:
    - aiac/src/aiac/agent/__init__.py: empty
    - aiac/src/aiac/agent/service/__init__.py: empty
    - aiac/src/aiac/agent/service/main.py: FastAPI app factory + uvicorn entrypoint
    - aiac/src/aiac/agent/service/routes.py: all six /apply/* route handlers
    - aiac/src/aiac/agent/service/Dockerfile: Docker image definition
    - aiac/src/aiac/agent/service/requirements.txt: Python dependencies
    - aiac/src/aiac/agent/agent/__init__.py: empty
    - aiac/src/aiac/agent/agent/state.py: AgentState, TriggerContext,
        KeycloakSnapshot (Pydantic BaseModel reusing User, RealmRole, Client, ClientRole,
        ClientScope, RoleMappings from aiac.library.models),
        ProposedDiff, RoleAssignment, ValidationVerdict
    - aiac/src/aiac/agent/agent/prompts.py: planner system prompt template,
        auditor system prompt template
    - aiac/src/aiac/agent/agent/nodes.py: fetch_policy, fetch_domain_knowledge,
        fetch_keycloak_state, propose_diff, validate_diff, apply_diff, format_response node functions
    - aiac/src/aiac/agent/agent/graph.py: StateGraph definition, edge wiring,
        compiled graph instance (module-level singleton),
        per-trigger helper functions exported as public API:
          run_rebuild(realm), run_user(user_id, realm),
          run_realm_role(role_id, realm), run_client(client_id, realm),
          run_client_role(client_id, role_id, realm), run_client_scope(scope_id, realm)
- Location: aiac/src/aiac/agent/
- Docker build context: aiac/src/
- Deployment: Kubernetes Pod
