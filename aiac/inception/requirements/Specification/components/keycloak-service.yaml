- Title: Keycloak Configuration Service
- Description: Web service providing read and write access to Keycloak configuration data via the Keycloak Admin REST API.
- Common query parameter:
    - realm (str, optional): when supplied, the request targets the named Keycloak realm
        instead of the service default (KEYCLOAK_REALM). Omit to use the service default.
        When provided, a new KeycloakAdmin bound to that realm is instantiated per request.
- Methods:
  - Get users:
    - Description: Retrieves current users from Keycloak server.
    - Endpoint: /users
  - Get realm roles:
    - Description: Retrieves current realm roles from Keycloak server.
    - Endpoint: /realm-roles
  - Get user role mappings:
    - Description: Retrieves realm and client role mappings for a specific user from Keycloak server.
    - Endpoint: /users/{user_id}/role-mappings
    - Path parameter: user_id (Keycloak user UUID)
    - Keycloak Admin API: GET /admin/realms/{realm}/users/{user_id}/role-mappings
    - Returns: raw JSON object with realmMappings and clientMappings fields
  - Get clients:
    - Description: Retrieves current clients from Keycloak server.
    - Endpoint: /clients
  - Get client scopes:
    - Description: Retrieves current client scopes from Keycloak server.
    - Endpoint: /client-scopes
  - Get client roles:
    - Description: Retrieves roles defined for a specific client.
    - Endpoint: /clients/{client_id}/roles
    - Path parameter: client_id (Keycloak client UUID)
    - Keycloak Admin API: GET /admin/realms/{realm}/clients/{client_id}/roles
    - Returns: raw JSON array of role objects
  - Assign client roles to user:
    - Description: Assigns one or more client roles to a user.
    - Endpoint: /users/{user_id}/role-mappings/clients/{client_id}
    - Path parameters: user_id (Keycloak user UUID), client_id (Keycloak client UUID)
    - Keycloak Admin API: POST /admin/realms/{realm}/users/{user_id}/role-mappings/clients/{client_id}
    - Body: JSON array of role representation objects
    - Returns: 204 No Content on success
  - Revoke client roles from user:
    - Description: Revokes one or more client roles from a user.
    - Endpoint: /users/{user_id}/role-mappings/clients/{client_id}
    - Path parameters: user_id (Keycloak user UUID), client_id (Keycloak client UUID)
    - Keycloak Admin API: DELETE /admin/realms/{realm}/users/{user_id}/role-mappings/clients/{client_id}
    - Body: JSON array of role representation objects
    - Returns: 204 No Content on success
- Framework: FastAPI with uvicorn
- Bind: 0.0.0.0 (exposed as Kubernetes ClusterIP Service for inter-Pod access; also reachable via kubectl port-forward)
- Implementation: Python
- Port: 7070
- Location: aiac/src/aiac/keycloak/service/
- Image: Built independently via its own Dockerfile in aiac/src/aiac/keycloak/service/.
- Deployment: Docker container in the Keycloak Service Pod, exposed as Kubernetes ClusterIP Service.
