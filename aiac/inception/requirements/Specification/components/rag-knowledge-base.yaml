- Title: AIAC RAG Knowledge Base
- Description: >
    Vector store knowledge base that holds two collections in a single ChromaDB instance:
    (1) AIAC access control policies and (2) org/business domain context. The Agent retrieves
    relevant chunks from both collections at runtime via similarity search. Deployed as a
    Kubernetes Deployment in a dedicated Pod, co-located with the RAG Ingest Service.
- Technology: ChromaDB
- Collections:
    - aiac-policies: access control policy rules in natural language.
        Written by the RAG Ingest Service via the "policy" collection slug.
        Read by the AIAC Agent's fetch_policy node.
    - aiac-domain-knowledge: org/business context — team rosters, application ownership,
        department mappings, who-does-what. Written by the RAG Ingest Service via the
        "domain-knowledge" collection slug. Read by the AIAC Agent's fetch_domain_knowledge node.
    The legal collection set is an open extension point governed by AIAC_RAG_COLLECTIONS
    on the RAG Ingest Service. ChromaDB itself imposes no constraint on the collection set.
    Collection slug (wire) → ChromaDB collection name mapping:
        policy            → aiac-policies
        domain-knowledge  → aiac-domain-knowledge
- Access patterns:
    - RAG Ingest Service: writes — replaces, upserts, or deletes documents in either
        collection via collection-parameterized endpoints. Each chunk stored with
        doc_id in its metadata to support document-level upsert and deletion.
    - AIAC Agent fetch_policy: reads aiac-policies (similarity search, top-N chunks)
    - AIAC Agent fetch_domain_knowledge: reads aiac-domain-knowledge (similarity search,
        top-N chunks, same query keying as fetch_policy: trigger TYPE only)
- Port: 7080
- Dependencies: TBD
- Location: TBD
- Deployment: Kubernetes Deployment, dedicated RAG Pod, co-located with RAG Ingest Service
