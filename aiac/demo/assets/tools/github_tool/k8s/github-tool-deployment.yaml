---
# github-tool — simplified 4-scope MCP stub for UC-1 onboarding.
#
# DISTINCT from the production 44-tool github-tool-mcp used by the github-agent
# for live GitHub operations. These two coexist under different Service names:
#   github-tool     (this file, port 9090) — UC-1 discovery, client.name = "team1/github-tool"
#   github-tool-mcp (authbridge/demos/github-issue/k8s/) — agent execution
#
# Naming invariants (do not rename):
#   workload name == Service name == "github-tool"
#   analyze_tool endpoint: http://github-tool.team1.svc.cluster.local:9090/mcp
#
# rossoctl.io/type=tool is applied by the rossoctl-operator when it reconciles
# the AgentRuntime below; do not hand-set it here.
#
# In-cluster PORT override (9095, not the image's default 9090): the
# AuthBridge sidecar shifts the app's real listen port to (declared PORT)+1
# and reuses the declared PORT itself for its own reverse-proxy listener.
# AuthBridge also has a *fixed* health-check listener hardcoded to 9091. If
# the declared PORT is 9090, the app's shifted port (9091) collides with that
# fixed health listener and the container crash-loops. 9095 (shifted: 9096)
# clears every AuthBridge-fixed port (8080, 8081, 9091, 9093, 9094). The
# Service keeps its external port at 9090 — only containerPort/PORT/probes/
# targetPort move to 9095.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-tool
  namespace: team1

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-tool
  namespace: team1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-tool
  template:
    metadata:
      labels:
        app: github-tool
    spec:
      serviceAccountName: github-tool
      # The image runs as non-root UID 10001 (see the github_tool Dockerfile).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: github-tool
          image: localhost/github-tool:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9095
          # readOnlyRootFilesystem is on; temp writes go to the /tmp emptyDir.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "9095"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          # FastMCP exposes no /health endpoint, so both probes are gated on the
          # MCP port accepting TCP connections.
          readinessProbe:
            tcpSocket:
              port: 9095
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9095
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# Service — exposes /mcp as the first (and only) port.
# The protocol.rossoctl.io/mcp label is a deploy-time prerequisite:
# analyze_tool returns 502 if this label is absent.
# The operator does NOT stamp it; it must be set explicitly here.
apiVersion: v1
kind: Service
metadata:
  name: github-tool
  namespace: team1
  labels:
    protocol.rossoctl.io/mcp: "true"
spec:
  selector:
    app: github-tool
  ports:
    - name: mcp
      port: 9090
      targetPort: 9095
  type: ClusterIP
---
# AgentRuntime — enrolls the workload so the rossoctl-operator:
#   - applies rossoctl.io/type=tool to the pod (read by classify_service), and
#   - registers a Keycloak client with client.name = "team1/github-tool"
#     (so analyze_tool derives scopes github-tool.{source-read,...}).
apiVersion: agent.rossoctl.dev/v1alpha1
kind: AgentRuntime
metadata:
  name: github-tool
  namespace: team1
spec:
  type: tool
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: github-tool
