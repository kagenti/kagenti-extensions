[tool.ruff]
line-length = 120
target-version = "py312"
# Apply excludes even to paths passed explicitly (e.g. by pre-commit / CI).
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
markers = [
    "integration: tests that call real LLM endpoints",
]
