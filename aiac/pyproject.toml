[project]
name = "aiac"
version = "0.1.0"
description = "AIAC — IdP configuration, PDP policy writer, and policy store services for Kagenti."
requires-python = ">=3.12"
# Runtime dependencies — union of the per-service requirements.txt files under src/aiac/.
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "python-keycloak",
    "python-dotenv",
    "requests",
    "kubernetes",
    "nats-py",
    "httpx",
    "langgraph",
    "langchain-openai",
    "chromadb",
    "tenacity",
]

[project.optional-dependencies]
# Test/dev tooling — install with: uv pip install -e ".[test]"
test = [
    "pytest",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# Apply excludes even to paths passed explicitly (e.g. by pre-commit / CI).
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
markers = [
    "integration: tests that call real LLM endpoints",
]
