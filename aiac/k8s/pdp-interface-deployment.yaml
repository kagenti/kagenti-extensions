# PHASE 1 LOCAL / KIND DEV TOPOLOGY
#
# This manifest uses node-local images (`localhost/...:local` +
# `imagePullPolicy: Never`), so it only runs on a cluster where every target
# node has been preloaded with those images (e.g. `kind load` / `podman save`).
# A production deployment must publish immutable, versioned images to the
# deployment registry and use `imagePullPolicy: IfNotPresent` — layer that in
# via a separate production overlay rather than editing this dev manifest.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiac-pdp-config
  namespace: aiac-system
data:
  KEYCLOAK_URL: "http://keycloak-service.keycloak.svc:8080"
  KEYCLOAK_REALM: "rossoctl"
  KEYCLOAK_ADMIN_REALM: "master"
  AIAC_PDP_CONFIG_URL: "http://aiac-pdp-config-service:7071"
  AIAC_PDP_POLICY_URL: "http://aiac-pdp-policy-service:7072"
  AIAC_POLICY_MODEL_STORE_URL: "http://aiac-policy-model-store-service:7074"
  # NATS_URL is added to this ConfigMap in Phase 2 (Event Broker, issue 4.19).
  # AIAC_RAG_INGEST_URL and AIAC_CHROMADB_URL are added in Phase 3 (RAG Pod, issue 4.20).

---
# Preconditions (NOT created by this manifest):
#
#   * The target namespace `aiac-system` must already exist
#     (`kubectl create namespace aiac-system`).
#   * The `keycloak-admin-secret` Secret must be pre-provisioned out-of-band —
#     credentials must NEVER be committed to git. The Deployment below references
#     it via secretRef. Create it once per cluster:
#
#       kubectl create secret generic keycloak-admin-secret \
#         -n aiac-system \
#         --from-literal=KEYCLOAK_ADMIN_USERNAME=<admin-user> \
#         --from-literal=KEYCLOAK_ADMIN_PASSWORD=<admin-password>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiac-interface
  namespace: aiac-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiac-interface
  template:
    metadata:
      labels:
        app: aiac-interface
    spec:
      # Both images run as non-root UID 10001. fsGroup makes the /rego emptyDir
      # (written by the aiac-pdp-policy-opa container) group-writable by that
      # user; without it the kubelet leaves the emptyDir root-owned and the
      # writer's /health check fails on the non-writable mount.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aiac-pdp-config
          image: localhost/aiac-pdp-config:local
          imagePullPolicy: Never
          ports:
            - containerPort: 7071
          # readOnlyRootFilesystem is on, so anything that writes to the
          # container filesystem (temp files, etc.) must land on a writable
          # mount — the emptyDir at /tmp below.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 7071
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 7071
            initialDelaySeconds: 10
            periodSeconds: 20
          envFrom:
            - configMapRef:
                name: aiac-pdp-config
            - secretRef:
                name: keycloak-admin-secret
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        # Phase 1 PDP Policy Writer: OPA rego-file mock. Generates Rego
        # packages and writes them as .rego files to REGO_OUTPUT_DIR. It is a
        # pure filesystem stub — no Keycloak, no k8s API — so it mounts neither
        # keycloak-admin-secret nor any Keycloak credentials. The AuthorizationPolicy
        # CR-backed variant (RBAC + env vars) is layered on later per issue 4.18.
        - name: aiac-pdp-policy-opa
          image: localhost/aiac-pdp-policy-opa:local
          imagePullPolicy: Never
          ports:
            - containerPort: 7072
          # Writes Rego to the /rego mount (writable); the rest of the root
          # filesystem is read-only, so temp writes go to the /tmp emptyDir.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 7072
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 7072
            initialDelaySeconds: 10
            periodSeconds: 20
          envFrom:
            - configMapRef:
                name: aiac-pdp-config
          env:
            - name: REGO_OUTPUT_DIR
              value: /rego
          volumeMounts:
            - name: rego-output
              mountPath: /rego
            - name: tmp-opa
              mountPath: /tmp
      volumes:
        - name: rego-output
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: tmp-opa
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: aiac-pdp-config-service
  namespace: aiac-system
spec:
  selector:
    app: aiac-interface
  ports:
    - name: idp-config
      port: 7071
      targetPort: 7071

---
apiVersion: v1
kind: Service
metadata:
  name: aiac-pdp-policy-service
  namespace: aiac-system
spec:
  selector:
    app: aiac-interface
  ports:
    - name: pdp-policy
      port: 7072
      targetPort: 7072
