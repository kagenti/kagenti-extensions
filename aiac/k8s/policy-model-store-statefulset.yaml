---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiac-policy-model-store-config
  namespace: aiac-system
data:
  SERVICEPOLICY_DB_PATH: "/data/policy_model.db"

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aiac-policy-model-store
  namespace: aiac-system
spec:
  replicas: 1
  serviceName: aiac-policy-model-store-headless
  selector:
    matchLabels:
      app: aiac-policy-model-store
  template:
    metadata:
      labels:
        app: aiac-policy-model-store
    spec:
      # The image runs as non-root UID 10001. fsGroup makes the mounted PVC
      # (/data, the SQLite backend) group-writable by that user; the image's
      # own chown of /data is masked once the volume is mounted over it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aiac-policy-model-store
          image: localhost/aiac-policy-model-store:local
          imagePullPolicy: Never
          ports:
            - containerPort: 7074
          # SQLite lives on the writable /data PVC; the rest of the root
          # filesystem is read-only, so temp writes go to the /tmp emptyDir.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 7074
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 7074
            initialDelaySeconds: 10
            periodSeconds: 20
          envFrom:
            - configMapRef:
                name: aiac-policy-model-store-config
          volumeMounts:
            - name: policy-model-store-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: policy-model-store-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
# Headless Service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: aiac-policy-model-store-headless
  namespace: aiac-system
spec:
  clusterIP: None
  selector:
    app: aiac-policy-model-store
  ports:
    - name: policy-model-store
      port: 7074
      targetPort: 7074

---
apiVersion: v1
kind: Service
metadata:
  name: aiac-policy-model-store-service
  namespace: aiac-system
spec:
  selector:
    app: aiac-policy-model-store
  ports:
    - name: policy-model-store
      port: 7074
      targetPort: 7074
