---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiac-policy-store-config
  namespace: aiac-system
data:
  AGENTPOLICY_DB_PATH: "/data/state.db"

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aiac-policy-store
  namespace: aiac-system
spec:
  replicas: 1
  serviceName: aiac-policy-store-headless
  selector:
    matchLabels:
      app: aiac-policy-store
  template:
    metadata:
      labels:
        app: aiac-policy-store
    spec:
      containers:
        - name: aiac-policy-store
          image: localhost/aiac-policy-store:local
          imagePullPolicy: Never
          ports:
            - containerPort: 7074
          envFrom:
            - configMapRef:
                name: aiac-policy-store-config
          volumeMounts:
            - name: policy-store-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: policy-store-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
# Headless Service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: aiac-policy-store-headless
  namespace: aiac-system
spec:
  clusterIP: None
  selector:
    app: aiac-policy-store
  ports:
    - name: policy-store
      port: 7074
      targetPort: 7074

---
apiVersion: v1
kind: Service
metadata:
  name: aiac-policy-store-service
  namespace: aiac-system
spec:
  selector:
    app: aiac-policy-store
  ports:
    - name: policy-store
      port: 7074
      targetPort: 7074
