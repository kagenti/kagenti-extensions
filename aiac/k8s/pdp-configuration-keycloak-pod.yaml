# DEV / ISOLATED TESTING ONLY
#
# This manifest deploys the PDP Configuration Service as a standalone Pod for
# isolated development and testing.  It does NOT reflect the production topology.
#
# In production both PDP services run as containers in a single PDP Interface Pod
# defined in pdp-interface-deployment.yaml (issue 4.2).

---
apiVersion: v1
kind: Namespace
metadata:
  name: aiac-system

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiac-pdp-configuration-keycloak-config
  namespace: aiac-system
data:
  KEYCLOAK_URL: "http://keycloak-service.keycloak.svc:8080"
  KEYCLOAK_REALM: "master"

---
# Prerequisites: create this Secret before applying this manifest:
#
#   kubectl create secret generic keycloak-admin-secret \
#     -n aiac-system \
#     --from-literal=KEYCLOAK_ADMIN_USERNAME=admin \
#     --from-literal=KEYCLOAK_ADMIN_PASSWORD=admin
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin-secret
  namespace: aiac-system
type: Opaque
stringData:
  KEYCLOAK_ADMIN_USERNAME: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "admin"

---
apiVersion: v1
kind: Pod
metadata:
  name: pdp-configuration-keycloak-pod
  namespace: aiac-system
  labels:
    app: pdp-configuration-keycloak-pod
spec:
  containers:
    - name: aiac-pdp-configuration-keycloak-service
      image: localhost/aiac-pdp-configuration-keycloak-service:local
      imagePullPolicy: Never
      ports:
        - containerPort: 7071
      envFrom:
        - configMapRef:
            name: aiac-pdp-configuration-keycloak-config
        - secretRef:
            name: keycloak-admin-secret
