# Variant of config.yaml for HTTPS drivers (e.g. Claude Code) that speak
# TLS to their model endpoint. Adds tls_bridge so the proxy can decrypt,
# and mcp-parser + a2a-parser so agentic tool traffic is classified.
# See ../hitl-with-claude-code.md.
mode: proxy-sidecar
listener:
  roles: [forward]
  forward_proxy_addr: 127.0.0.1:47600
  session_api_addr: 127.0.0.1:47601
stats:
  address: 127.0.0.1:47602
tls_bridge:
  mode: enabled
  ca_dir: "cortex-ca"
  generate_ca: true
pipeline:
  outbound:
    plugins:
      # Order matters: RunResponseFrame dispatches in REVERSE
      # declaration order, so session-budget (reads
      # Inference.TotalTokens) must be declared BEFORE
      # inference-parser (populates it).
      - name: session-budget
        config:
          redis_url: "redis://localhost:6379"
          max_tokens: 40000
          max_calls: 1000000              # effectively unlimited; we
                                          # let max_tokens trigger first
          on_exceed: "pause"
          pause_webhook: "http://localhost:9099"
          pause_timeout: "120s"
          pause_timeout_action: "deny"
          pause_grace_period: "1ms"
          session_ttl_seconds: 300
          default_session_fallback: true  # no inbound A2A session —
                                          # pool all egress into
                                          # 'default'
      - inference-parser
      - mcp-parser
      - a2a-parser
