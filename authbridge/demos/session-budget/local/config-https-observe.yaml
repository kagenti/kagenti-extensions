# Variant of config-https.yaml for shadow-mode operation: on_exceed=observe.
# Over-budget turns are logged and counted in Redis but NOT blocked, and
# there is no approver in the loop. Use this to size max_tokens before
# switching to on_exceed=pause. See ../hitl-with-claude-code.md.
mode: proxy-sidecar
listener:
  roles: [forward]
  forward_proxy_addr: 127.0.0.1:47600
  session_api_addr: 127.0.0.1:47601
stats:
  address: 127.0.0.1:47602
tls_bridge:
  mode: enabled
  ca_dir: "cortex-ca"
  generate_ca: true
pipeline:
  outbound:
    plugins:
      # Order matters: RunResponseFrame dispatches in REVERSE
      # declaration order, so session-budget (reads
      # Inference.TotalTokens) must be declared BEFORE
      # inference-parser (populates it).
      - name: session-budget
        config:
          redis_url: "redis://localhost:6379"
          # Deliberately tiny so the very first Claude Code turn breaches
          # and you see the shadow WARN on turn 2. Raise for real sizing.
          max_tokens: 100
          max_calls: 1000000              # effectively unlimited; we
                                          # let max_tokens trigger first
          on_exceed: "observe"
          session_ttl_seconds: 300
          default_session_fallback: true  # no inbound A2A session —
                                          # pool all egress into
                                          # 'default'
      - inference-parser
      - mcp-parser
      - a2a-parser
