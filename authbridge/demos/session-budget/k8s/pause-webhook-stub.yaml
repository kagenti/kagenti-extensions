# Minimal pause-mode webhook stub for the session-budget plugin.
# Returns {"action":"approve"} for every POST — use to smoke-test the
# on_exceed: pause flow end-to-end. For deny-path testing, edit the inline
# Python to write {"action":"deny"} instead.
#
# Usage:
#   kubectl apply -f pause-webhook-stub.yaml
#   # In session-budget config:
#   #   pause_webhook: "http://pause-webhook-stub.team1.svc.cluster.local"
#
# Logs:
#   kubectl logs -n team1 deploy/pause-webhook-stub
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pause-webhook-stub
  namespace: team1
  labels:
    app: pause-webhook-stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pause-webhook-stub
  template:
    metadata:
      labels:
        app: pause-webhook-stub
        # Opt out of ambient mesh: the plain HTTP stub isn't part of the
        # authbridge zero-trust boundary and ambient interception drops
        # non-HBONE peers with 'Connection reset'.
        istio.io/dataplane-mode: none
      annotations:
        ambient.istio.io/redirection: disabled
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stub
          image: python:3.12-alpine@sha256:d09d15e60962ca365d1cd544a48773bac9d33f2fb1b00f2aa0deec78ade7dc31
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["python", "-c"]
          args:
            - |
              import http.server, json, sys
              class Handler(http.server.BaseHTTPRequestHandler):
                  def do_POST(self):
                      n = int(self.headers.get("Content-Length", 0))
                      body = self.rfile.read(n).decode("utf-8", "replace")
                      print(f"[pause-webhook] POST {self.path} body={body}", flush=True)
                      resp = b'{"action":"approve"}'
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(resp)))
                      self.end_headers()
                      self.wfile.write(resp)
                  def log_message(self, *a, **k):
                      pass
              http.server.HTTPServer(("", 8080), Handler).serve_forever()
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pause-webhook-stub
  namespace: team1
spec:
  selector:
    app: pause-webhook-stub
  ports:
    - name: http
      port: 80
      targetPort: 8080
