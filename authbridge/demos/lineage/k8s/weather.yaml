# The weather pair from rossoctl/examples, deployed plain: no AgentRuntime, no
# platform sidecar, no auth — exactly the shape the lineage attach kit adopts.
# Two stock images, mirroring demos/weather-agent/k8s/*-advanced.yaml minus the
# enrollment labels and the auth ConfigMaps. One deliberate difference: the
# stock agent annotates its LLM port (11434) out of the sidecar's redirect;
# here it is left in, because the LLM hop is exactly what lineage should see.
# Point the agent at your LLM in the ConfigMap (host Ollama by default;
# qwen2.5:7b answers the demo's question with one tool call).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: weather-llm
  namespace: team1
data:
  # podman-backed kind reaches the host as host.containers.internal;
  # docker-backed kind as host.docker.internal. OpenAI: https://api.openai.com/v1
  # (an HTTPS LLM is TLS passthrough — the sidecar records no hop for it).
  LLM_API_BASE: "http://host.containers.internal:11434/v1"
  LLM_API_KEY: "ollama"
  LLM_MODEL: "qwen2.5:7b"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-service
  namespace: team1
  labels:
    app.kubernetes.io/name: weather-service
spec:
  # Cold pulls on kind can exceed the 600s default (as the stock manifests note).
  progressDeadlineSeconds: 1800
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: weather-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weather-service
    spec:
      # The image runs as 1001 (its Dockerfile); match it at pod level.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/rossoctl/examples/weather_service:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              value: "8000"
            - name: HOST
              value: "0.0.0.0"
            - name: UV_CACHE_DIR
              value: "/app/.cache"
            - name: MCP_URL
              value: "http://weather-tool-mcp:8000/mcp"
            - name: LOG_LEVEL
              value: "INFO"
          envFrom:
            - configMapRef:
                name: weather-llm
          volumeMounts:
            - name: cache
              mountPath: /app/.cache
            - name: marvin
              mountPath: /.marvin
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: cache
          emptyDir: {}
        - name: marvin
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: weather-service
  namespace: team1
spec:
  selector:
    app.kubernetes.io/name: weather-service
  ports:
    - name: http
      port: 8080
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-tool
  namespace: team1
  labels:
    app.kubernetes.io/name: weather-tool
spec:
  progressDeadlineSeconds: 1800
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: weather-tool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weather-tool
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/rossoctl/examples/weather_tool:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              value: "8000"
            - name: HOST
              value: "0.0.0.0"
            - name: UV_NO_CACHE
              value: "1"
          volumeMounts:
            - name: cache
              mountPath: /app/.cache
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: weather-tool-mcp
  namespace: team1
spec:
  selector:
    app.kubernetes.io/name: weather-tool
  ports:
    - name: http
      port: 8000
      targetPort: 8000
