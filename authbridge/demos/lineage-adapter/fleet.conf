# fleet.conf — the CATALOG that links each existing Kagenti app to its lineage
# adaptation. `deploy-fleet.sh` reads this; `verify-fleet.sh` tests it.
#
# Plug & play a new app = add ONE line. Pipe-delimited (values may contain spaces
# and '='; none contain '|'). Blank lines and lines starting with '#' are ignored.
#
# COLUMNS:
#   name       k8s resource name (also app.kubernetes.io/name).
#   role       agent | tool. Tools are deployed BEFORE agents (so agent MCP_URL resolves).
#   image      ghcr:<matrix-name>            -> pull ghcr.io/kagenti/agent-examples/<name>
#              local:<path-under-repo-root>  -> podman build that path's Dockerfile
#   entrypoint the app's OWN command AFTER `opentelemetry-instrument` (see RUNBOOK step 3):
#              a console script, `python -m <pkg> ...`, `python <file.py>`, or `uvicorn <m>:app ...`.
#   self_id    lineage self_id (span names <self_id>.inbound/.llm/.mcp*/.http).
#   port       app container port.
#   svcport    Service port (agents 8080; tools usually = port).
#   env        space-separated KEY=VALUE app env (LLM repoint, MCP_URL wiring, tokens…). May be empty.
#   overlay    '-' or an overlays/<Dockerfile> applied on top of the shim (per-app upstream fix).
#
# LLM repointing: plaintext host Ollama at host.containers.internal:11434, model qwen2.5:7b
# (aliased to gpt-4o-mini for Marvin's model-name allowlist — deploy-fleet.sh does the alias).
#
# name|role|image|entrypoint|self_id|port|svcport|env|overlay

# ---- tools (deployed first) ----
slack-tool|tool|ghcr:slack_tool|python slack_tool.py|slack-tool|8000|8000|SLACK_BOT_TOKEN=xoxb-fake-token-for-startup|-
reservation-tool|tool|ghcr:reservation_tool|python reservation_tool.py|reservation-tool|8000|8000||-
wiki-service|tool|local:agent-examples/mcp/wiki_memory_tool|uvicorn wiki_service:app --host 0.0.0.0 --port 8000|wiki-service|8000|8000|JWT_SECRET_KEY=testsecret123 WIKI_ROOT=/tmp/wiki GIT_AUTHOR_NAME=wiki GIT_AUTHOR_EMAIL=wiki@example.com GIT_COMMITTER_NAME=wiki GIT_COMMITTER_EMAIL=wiki@example.com|-
wiki-mcp|tool|local:agent-examples/mcp/wiki_memory_tool|python mcp_server.py|wiki-mcp|8000|8000|MCP_TRANSPORT=streamable-http MCP_PORT=8000 MCP_HOST=0.0.0.0 WIKI_SERVICE_URL=http://wiki-service.team1.svc.cluster.local:8000|-

