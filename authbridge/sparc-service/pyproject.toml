[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rossoctl-sparc-service"
version = "0.1.0"
description = "Rossoctl SPARC reflection service — a thin in-process HTTP wrapper around the SPARC pre-tool reflection component from the agent-lifecycle-toolkit (ALTK)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    # The SPARC engine itself. Temporarily pinned to a fork branch commit
    # containing OsherElhadad's bundled fix for altk-boost #118, #119, #120
    # (native structured-output compatibility with strict providers).
    # Reverts to a PyPI version once the fix is merged upstream and released.
    "agent-lifecycle-toolkit @ git+https://github.com/OsherElhadad/altk-boost@bbd47da842d753aac1ca91a6d328af3c36e27178",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
rossoctl-sparc-service = "sparc_service.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["sparc_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
